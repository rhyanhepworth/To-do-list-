<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #6a82fb, #fc5c7d);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .card {
    background: #fff;
    width: 100%;
    max-width: 420px;
    border-radius: 16px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    padding: 32px;
  }

  h1 {
    margin: 0 0 20px;
    text-align: center;
    font-size: 24px;
    color: #333;
  }

  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }

  #task-input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }

  #task-input:focus {
    border-color: #6a82fb;
  }

  #add-btn {
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    background: #6a82fb;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }

  #add-btn:hover {
    background: #5a70e0;
  }

  #task-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .task-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: #f7f8fc;
    border-radius: 8px;
    transition: background 0.2s;
  }

  .task-item:hover {
    background: #eef0fb;
  }

  .task-item input[type="checkbox"] {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    cursor: pointer;
    accent-color: #6a82fb;
  }

  .task-text {
    flex: 1;
    font-size: 15px;
    color: #333;
    word-break: break-word;
  }

  .task-item.done .task-text {
    text-decoration: line-through;
    color: #aaa;
  }

  .delete-btn {
    border: none;
    background: transparent;
    color: #ccc;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 6px;
    transition: color 0.2s, background 0.2s;
  }

  .delete-btn:hover {
    color: #fff;
    background: #fc5c7d;
  }

  .empty-message {
    text-align: center;
    color: #aaa;
    font-size: 14px;
    padding: 20px 0;
  }

  .task-item.filtered-out {
    display: none;
  }

  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px solid #eee;
    font-size: 13px;
    color: #888;
  }

  .footer[hidden] {
    display: none;
  }

  .filters {
    display: flex;
    gap: 4px;
  }

  .filter-btn {
    border: none;
    background: transparent;
    color: #888;
    font-size: 13px;
    padding: 4px 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }

  .filter-btn:hover {
    background: #f0f1fa;
  }

  .filter-btn.active {
    background: #6a82fb;
    color: #fff;
  }
</style>
</head>
<body>

  <div class="card">
    <h1>My To-Do List</h1>

    <div class="input-row">
      <input type="text" id="task-input" placeholder="Add a new task..." autofocus>
      <button id="add-btn">Add</button>
    </div>

    <ul id="task-list"></ul>

    <div class="footer" id="footer" hidden>
      <span id="task-count"></span>
      <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>
    </div>
  </div>

  <script>
    const taskInput = document.getElementById('task-input');
    const addBtn = document.getElementById('add-btn');
    const taskList = document.getElementById('task-list');
    const footer = document.getElementById('footer');
    const taskCount = document.getElementById('task-count');
    const filterBtns = document.querySelectorAll('.filter-btn');

    let currentFilter = 'all';

    function renderEmptyState() {
      if (taskList.children.length === 0) {
        const li = document.createElement('li');
        li.className = 'empty-message';
        li.textContent = 'No tasks yet — add one above!';
        taskList.appendChild(li);
      }
    }

    function removeEmptyState() {
      const empty = taskList.querySelector('.empty-message');
      if (empty) empty.remove();
    }

    function applyFilter() {
      const items = taskList.querySelectorAll('.task-item');
      items.forEach(item => {
        const done = item.classList.contains('done');
        const show = currentFilter === 'all'
          || (currentFilter === 'active' && !done)
          || (currentFilter === 'completed' && done);
        item.classList.toggle('filtered-out', !show);
      });
    }

    function updateFooter() {
      const items = taskList.querySelectorAll('.task-item');
      footer.hidden = items.length === 0;

      const remaining = [...items].filter(item => !item.classList.contains('done')).length;
      taskCount.textContent = `${remaining} item${remaining === 1 ? '' : 's'} left`;
    }

    function refreshView() {
      applyFilter();
      updateFooter();
    }

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        currentFilter = btn.dataset.filter;
        filterBtns.forEach(b => b.classList.toggle('active', b === btn));
        applyFilter();
      });
    });

    const STORAGE_KEY = 'todo-tasks';

    function saveTasks() {
      const tasks = [...taskList.querySelectorAll('.task-item')].map(li => ({
        text: li.querySelector('.task-text').textContent,
        done: li.classList.contains('done')
      }));
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    function loadTasks() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      try {
        return JSON.parse(raw);
      } catch {
        return [];
      }
    }

    function createTaskElement(text, done) {
      const li = document.createElement('li');
      li.className = 'task-item';
      if (done) li.classList.add('done');

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = done;
      checkbox.addEventListener('change', () => {
        li.classList.toggle('done', checkbox.checked);
        saveTasks();
        refreshView();
      });

      const span = document.createElement('span');
      span.className = 'task-text';
      span.textContent = text;

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'delete-btn';
      deleteBtn.textContent = '×';
      deleteBtn.addEventListener('click', () => {
        li.remove();
        renderEmptyState();
        saveTasks();
        refreshView();
      });

      li.appendChild(checkbox);
      li.appendChild(span);
      li.appendChild(deleteBtn);
      return li;
    }

    function addTask() {
      const text = taskInput.value.trim();
      if (!text) return;

      removeEmptyState();
      taskList.appendChild(createTaskElement(text, false));
      saveTasks();
      refreshView();

      taskInput.value = '';
      taskInput.focus();
    }

    addBtn.addEventListener('click', addTask);
    taskInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addTask();
    });

    loadTasks().forEach(task => {
      taskList.appendChild(createTaskElement(task.text, task.done));
    });
    renderEmptyState();
    refreshView();
  </script>

</body>
</html>
